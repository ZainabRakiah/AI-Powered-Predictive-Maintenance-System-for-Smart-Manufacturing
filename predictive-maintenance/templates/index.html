<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predictive Maintenance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<h1>AI Predictive Maintenance Dashboard</h1>

<div class="container">

    <label class="field-label" for="type">Product type</label>
    <select id="type">
        <option value="L">L</option>
        <option value="M" selected>M</option>
        <option value="H">H</option>
    </select>

    <input type="number" id="air_temp" placeholder="Air Temperature (K)" step="any" />
    <input type="number" id="process_temp" placeholder="Process Temperature (K)" step="any" />
    <input type="number" id="rpm" placeholder="RPM" step="any" />
    <input type="number" id="torque" placeholder="Torque (Nm)" step="any" />
    <input type="number" id="tool_wear" placeholder="Tool Wear (min)" step="any" />

    <button type="button" onclick="predict()">Predict</button>

    <h2 id="result"></h2>
    <p id="detail" class="detail"></p>
    <p id="error" class="error" role="alert"></p>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
